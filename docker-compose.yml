# Nombre del proyecto Compose: prefija container y volúmenes.
# Distintos SANDBOX_NAME = instancias con persistencia aislada.
name: ${SANDBOX_NAME:-ai-sandbox}

services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        # Lista separada por comas (claude,codex,opencode). Vacío = ninguno.
        AGENTS: ${AGENTS:-}
    volumes:
      # Workspace principal
      - ./workspaces:/workspaces:cached

      # Persistir configuración y credenciales de cada agente entre rebuilds
      # (un volumen sin agente instalado es inofensivo)
      - claude-config:/root/.claude
      - codex-config:/root/.codex
      - opencode-config:/root/.config/opencode
      - opencode-data:/root/.local/share/opencode

      # Persistir historial de bash/zsh
      - shell-history:/root/.shell_history

      # Montar el socket de Docker del host para usar Docker-in-Docker
      # - /var/run/docker.sock:/var/run/docker.sock

      # Caché de npm/bun para no re-descargar paquetes en cada build
      # - npm-cache:/root/.npm
      # - bun-cache:/root/.bun/install/cache
      # - pnpm-store:/root/.local/share/pnpm


    # Permite usar herramientas de red como lsof, ss, etc.
    network_mode: host  # o usar bridge si preferís aislamiento

    # Capacidades extra útiles para desarrollo
    cap_add:
      - SYS_PTRACE   # permite strace y debuggers
    security_opt:
      - seccomp:unconfined  # necesario para algunos debuggers

    # Evita que el container se reinicie solo (VS Code lo maneja)
    restart: "no"

volumes:
  claude-config:
  codex-config:
  opencode-config:
  opencode-data:
  shell-history:
  # npm-cache:
  # bun-cache:
  # pnpm-store:
